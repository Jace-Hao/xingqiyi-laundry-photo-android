# Gradle 守护进程内存：Compose + kapt 编译较吃内存，给足避免 OOM 后反复重编译
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX 必须开启（项目全部依赖 androidx.*）
android.useAndroidX=true
android.nonTransitiveRClass=true
android.nonFinalResIds=false

# Kotlin 代码风格遵循官方规范
kotlin.code.style=official

# AGP 默认拒绝在非 ASCII 路径下编译。本仓库路径本身是纯 ASCII，
# 但本机开发时可能把工程放在中文目录下（历史上的桌面端仓库就是这样），
# 保留该开关以免换机器就编不过。
android.overridePathCheck=true

# ---------- 版本号 ----------
# 本仓库的版本号**只**在 app/build.gradle.kts 中维护（versionName / versionCode），
# 与桌面端仓库的 package.json 完全无关。此处不设版本，避免出现第二个真值来源。
